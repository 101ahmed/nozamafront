<header class="site-header">
  <div class="top-bar">
    <span class="top-bar-msg">Deliver to <strong>Egypt</strong></span>
    <nav class="top-links" aria-label="Quick links">
      <a href="#">Today's Deals</a>
      <a href="#">Customer Service</a>
      <a href="#">Registry</a>
      <a href="#">Gift Cards</a>
      <a href="#">Sell</a>
    </nav>
  </div>

  <div class="main-bar">
    <a routerLink="/" class="logo" aria-label="Nozama home">nozama<span class="logo-dot">.</span></a>

    <div class="deliver">
      <span class="deliver-label">Deliver to</span>
      <span class="deliver-place">Cairo 11511</span>
    </div>

    <form class="search" role="search" (submit)="$event.preventDefault()">
      <label class="sr-only" for="site-search">Search Nozama</label>
      <select class="search-scope" aria-label="Department">
        <option>All</option>
        <option>Electronics</option>
        <option>Books</option>
      </select>
      <input id="site-search" type="search" placeholder="Search Nozama" autocomplete="off" />
      <button type="submit" class="search-submit" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Zm0-2a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11Z"
            fill="currentColor"
          />
          <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </form>

    <div class="main-bar-actions">
      <a href="#" class="nav-block">
        <span class="nav-small">Hello, sign in</span>
        <span class="nav-strong">Account & Lists</span>
      </a>
      <a href="#" class="nav-block">
        <span class="nav-small">Returns</span>
        <span class="nav-strong">& Orders</span>
      </a>
      <a routerLink="/" class="cart" aria-label="Shopping cart">
        <span class="cart-icon-wrap">
          <svg width="38" height="26" viewBox="0 0 48 36" aria-hidden="true">
            <path
              fill="currentColor"
              d="M14 8h28l-4 20H18L14 8Zm4-4h10v4H18V4Z"
            />
          </svg>
          <span class="cart-badge" *ngIf="cartCount$ | async as c">{{ c }}</span>
        </span>
        <span class="cart-label">Cart</span>
      </a>
    </div>
  </div>

  <nav class="sub-bar" aria-label="Categories">
    <button type="button" class="all-menu" aria-expanded="false">
      <span class="all-icon">≡</span>
      All
    </button>
    <a href="#">Today's Deals</a>
    <a href="#">Customer Service</a>
    <a href="#">Registry</a>
    <a href="#">Gift Cards</a>
    <a href="#">Sell</a>
    <a href="#">Electronics</a>
    <a href="#">Books</a>
    <a href="#">Fashion</a>
    <a href="#">Home & Kitchen</a>
    <a href="#">Sports</a>
    <a href="#">Automotive</a>
  </nav>
</header>
