<div class="home">
  <section class="hero" aria-label="Promotions">
    <div class="hero-inner">
      <div class="hero-copy">
        <p class="hero-kicker">Spring savings event</p>
        <h1>Deals on electronics &amp; more</h1>
        <p class="hero-sub">Free delivery on your first eligible order. Demo storefront — not a real store.</p>
        <a class="hero-cta" href="#">Shop all deals</a>
      </div>
    </div>
  </section>

  <div class="page-inner">
    <section class="panel categories" aria-labelledby="cat-heading">
      <h2 id="cat-heading">Shop by category</h2>
      <div class="category-grid">
        <a
          *ngFor="let c of categories"
          [routerLink]="['/category', c.slug]"
          class="category-card"
        >
          <img [src]="c.imageUrl" [alt]="c.label" width="200" height="200" loading="lazy" />
          <span>{{ c.label }}</span>
        </a>
      </div>
    </section>

    <section class="panel deals" aria-labelledby="deals-heading">
      <div class="panel-head">
        <h2 id="deals-heading">Today's Deals</h2>
        <a href="#" class="panel-link">See all deals</a>
      </div>
      <div class="product-row">
        <app-product-card *ngFor="let p of deals" [product]="p"></app-product-card>
      </div>
    </section>

    <section class="panel featured" aria-labelledby="feat-heading">
      <div class="panel-head">
        <h2 id="feat-heading">Recommended for you</h2>
        <a href="#" class="panel-link">Browse more</a>
      </div>
      <div class="product-row">
        <app-product-card *ngFor="let p of featured" [product]="p"></app-product-card>
      </div>
    </section>
  </div>
</div>
